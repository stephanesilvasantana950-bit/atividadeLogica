<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>CONTADO COM FOR</h1>

    <script>
        document.write("<h2>Contagem</h2>");

        for(let i = 10; i <= 100; i+= 10){
            document.write("Volta número" + i + "<br>");
        }
        document.write("Finale ;)");
    </script>

    <!--
1. No lugar do 5 coloquei 20 ele mostra uma lista de numero de 1 até 20
for(let i = 1; i <= 20; i++)
let i = 1 : Mostra onde vai começar a contagem, 
i <= 20; : Até onde deve contar
i++ : Vai soma mais 1 com o numero anterior

2. Ele vai começar no 10, é a mesma lógica da questão.

3. Onestamente não teria um parametro pra somar com o número anterior então acho que iria imprimir o primeiro valor e o ultimo.
-->
</body>
</html>
