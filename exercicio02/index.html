<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>IDADE</h1>

    <script>
        let idade = Number(prompt("Quantos anos você tem?"));

        if(idade >= 18){
            alert("Você já pode tirar a carteira de motorista. ");
        }
        else{
            let falta = 18 - idade;
            alert("Faltam " + falta + " anos para você tirar a carteira, tenha calma;).");
        }

        //let idade = prompt("Qual é sua idade?");

        //alert(idade + 1);        // 201
        //alert(Number(idade) + 1); // 21 
                
    </script>

    <!--
1. Aparece Faltam 2 anos para você tirar a carteira, tenha calma;)
2. Sem o Number ele junta os caracteres e não soma com se fossem strings
Já quando tem o Number ele soma os valores como numeros normais
O simbolo >= significa meno ou igual a algo (então tanto faz se for um int ou string)
O Number indetifica os numeros dentro do prompt 
-->
</body>
</html>
