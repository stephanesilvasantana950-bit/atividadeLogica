<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>PÁGINA DE INTERESSE</h1>

    <script>
        let nome = prompt("Qual é o seu nome?");
        let interesses = [];
        let item = prompt("O que você quer aprender a criar(ou fim para parar)");

        while (item !== "fim"){
            interesses.push(item);
            item = prompt("Mais um? (ou fim para parar)");
        }

        document.write("<h1>" + nome + "</h1>");

        if(interesses.length === 0){
            document.write("Você não contou nenhum interesse.");
        }
        else{
            document.write("<p>Coisas que eu curto:</p>");
            for (let i = 0; i < interesses.length; i++){
                document.write(". " + interesses[i] + "<br>");
            }
        }
    </script>
    <!--
    1. 3
    2. Feito
    3. Porque usamos while quando não sabemos exatamente quantas vezes o código vai se repetir, e usamos for quando já sabemos a quantidade de repetições.
    -->
</body>
</html>
