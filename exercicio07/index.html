<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ESCOLHA O SEU PLANO</h1>

    <script>
        let opcao = prompt("Escolha um plano:\n1 - Básico\n2 - Padrão\n3 - Premium");

        switch (opcao){
            case "1": alert("Básico: R$ 19,90  por mês"); break;
            case "2": alert("Básico: R$ 39,90  por mês"); break;
            case "3": alert("Básico: R$ 69,90  por mês"); break;
            default: alert("Opção inválida");
        }
    </script>
</body>
</html>
